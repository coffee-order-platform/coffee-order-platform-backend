spring:
  application:
    name: coffee-order
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:${DB_PORT:3306}/${DB_NAME:coffee_order}?characterEncoding=UTF-8
    username: ${DB_USERNAME:coffee}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: localhost
      port: ${REDIS_PORT:6379}
      # Redis 명령 하나의 응답을 기다리는 최대 시간(접속 대기는 별도 connect-timeout).
      # 주문 커밋 후 인기 메뉴 반영은 명령을 (메뉴 수 + 1)번 보내므로, Redis 가 느려지면 주문 응답이 최대 그 배수만큼 늦어진다.
      # 코드 수정 없이 환경변수로 늘리거나 줄인다(11/19 결정, 기본 2초)
      timeout: ${REDIS_TIMEOUT:2s}
  jackson:
    deserialization:
      # 금액·수량 같은 정수 칸에 소수(1000.5)가 오면 잘라 받지 않고 400 INVALID_REQUEST 로 거절한다
      accept-float-as-int: false
    mapper:
      # 따옴표로 감싼 숫자("5")를 숫자로 바꿔 받지 않고 400 INVALID_REQUEST 로 거절한다(11/18 결정)
      allow-coercion-of-scalars: false
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
