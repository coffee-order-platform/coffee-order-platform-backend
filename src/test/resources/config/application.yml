# 테스트 전용 설정(11/23 결정). main 의 application.yml 위에 아래 키만 덮어쓴다(classpath:/config/ 가 우선).
# 커밋되는 동시성 테스트가 개발 DB·개발 Redis 를 더럽히지 않게, 같은 MySQL 의 별도 스키마와 Redis 1번 DB 를 쓴다.
# 스키마는 docker-compose 가 처음 켤 때 만든다(docker/mysql-init). 이미 쓰던 볼륨이면 저장소 루트에서 한 번 실행한다:
#   docker compose exec -T mysql sh < docker/mysql-init/01-test-schema.sh
# CI 는 서비스 컨테이너의 MYSQL_DATABASE 가 만든다(.github/workflows/ci.yml, 이름이 같아야 한다)
spring:
  datasource:
    url: jdbc:mysql://localhost:${DB_PORT:3306}/coffee_order_test?characterEncoding=UTF-8
  data:
    redis:
      database: 1
