name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 테스트(contextLoads)가 MySQL·Redis 접속을 필요로 해서 CI용 임시 서비스를 띄운다
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: coffee_order
          MYSQL_USER: coffee
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # CI 전용 값이다. 실제 비밀값이 아니며 .env 는 저장소에 없다
    env:
      DB_NAME: coffee_order
      DB_PORT: 3306
      DB_USERNAME: coffee
      DB_PASSWORD: ci-password
      REDIS_PORT: 6379
      DDL_AUTO: create-drop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build
